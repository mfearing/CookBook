spring:
  datasource:
    platform: postgres
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/backend?currentSchema=recipedb
    username: backend
    password: backend
    initialization-mode: always
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
  kafka:
    consumer:
      group-id: recipe-application

server:
  servlet:
    context-path: /v1/rcp
